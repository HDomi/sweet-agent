name: Sync SKILL.md and rules

on:
  push:
    branches: [main]
    paths:
      - skills/sweet/SKILL.md
      - skills/sweetcrew/SKILL.md
      - agents/sweetcrew-*.md
      - skills/sweet-compress/SKILL.md
      - skills/sweet-compress/scripts/**
      - skills/sweet-stats/SKILL.md

concurrency:
  group: sync-skill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest before making changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Sync SKILL.md copies
        run: |
          cp skills/sweet/SKILL.md plugins/sweet-agent/skills/sweet/SKILL.md

      - name: Sync sweet-compress skill to plugin
        run: |
          # Plugin distribution mirrors source verbatim — no rename, no sed.
          mkdir -p plugins/sweet-agent/skills/sweet-compress
          cp skills/sweet-compress/SKILL.md plugins/sweet-agent/skills/sweet-compress/SKILL.md
          rm -rf plugins/sweet-agent/skills/sweet-compress/scripts
          cp -r skills/sweet-compress/scripts plugins/sweet-agent/skills/sweet-compress/scripts
          rm -rf plugins/sweet-agent/skills/sweet-compress/scripts/__pycache__

      - name: Sync sweetcrew skill + agents to plugin
        run: |
          mkdir -p plugins/sweet-agent/skills/sweetcrew plugins/sweet-agent/agents
          cp skills/sweetcrew/SKILL.md plugins/sweet-agent/skills/sweetcrew/SKILL.md
          cp agents/sweetcrew-investigator.md plugins/sweet-agent/agents/sweetcrew-investigator.md
          cp agents/sweetcrew-builder.md plugins/sweet-agent/agents/sweetcrew-builder.md
          cp agents/sweetcrew-reviewer.md plugins/sweet-agent/agents/sweetcrew-reviewer.md

      # Upstream left this mirror to drift (hand-committed, never synced).
      # plugins/sweet-agent/skills/sweet-stats/ exists, so keep it in sync too.
      - name: Sync sweet-stats skill to plugin
        run: |
          mkdir -p plugins/sweet-agent/skills/sweet-stats
          cp skills/sweet-stats/SKILL.md plugins/sweet-agent/skills/sweet-stats/SKILL.md

      - name: Rebuild sweet.skill ZIP
        run: mkdir -p dist && cd skills && zip -r ../dist/sweet.skill sweet/

      - name: Verify mirrors and zip match source
        run: python3 tests/verify_repo.py

      - name: Commit and push if changed
        run: |
          git add \
            skills/sweet-compress/ \
            plugins/sweet-agent/skills/sweet-compress/ \
            plugins/sweet-agent/skills/sweet/SKILL.md \
            plugins/sweet-agent/skills/sweetcrew/SKILL.md \
            plugins/sweet-agent/skills/sweet-stats/SKILL.md \
            plugins/sweet-agent/agents/sweetcrew-investigator.md \
            plugins/sweet-agent/agents/sweetcrew-builder.md \
            plugins/sweet-agent/agents/sweetcrew-reviewer.md \
            dist/sweet.skill
          git diff --staged --quiet && exit 0
          git commit -m "chore: sync SKILL.md copies [skip ci]"
          git push
